[package]
name = "megatemp"
version = "2.0.0"
edition = "2021"
description = "Bulk MEGA account creator and manager with a native GUI — Rust port of MegaTemp"
license = "GPL-3.0-only"
repository = "https://github.com/SchooiCodes/MegaTemp_Rust"
homepage = "https://github.com/SchooiCodes/MegaTemp_Rust#readme"
readme = "README.md"
keywords = ["mega", "account-creator", "automation", "egui", "cli"]
categories = ["command-line-utilities"]
exclude = ["target/", "credentials/", "config*.json", "loop_state.json"]

[lib]
name = "megatemp"
path = "src/lib.rs"

[[bin]]
name = "megatemp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream", "blocking"] }
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
ctr = "0.9"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
base64 = "0.22"
rand = "0.8"
regex = "1"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
fs2 = "0.4"
dirs = "6"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
crossterm = "0.28"
sysinfo = "0.33"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "clipboard", "links"] }
egui_extras = { version = "0.37", features = ["image", "svg"] }
tokio-util = { version = "0.7", features = ["rt"] }
rfd = "0.18"
image = "0.25"

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
