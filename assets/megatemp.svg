<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="disc">
      <circle cx="256" cy="256" r="158"/>
    </clipPath>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#ED1C24"/>
    </pattern>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect x="0" y="0" width="2.4" height="14" fill="#ED1C24"/>
    </pattern>
  </defs>

  <!-- rounded app tile: the corners stay transparent -->
  <rect x="22" y="22" width="468" height="468" rx="86" fill="#ED1C24"/>

  <!-- white disc inside the tile -->
  <circle cx="256" cy="256" r="158" fill="#FFFFFF"/>

  <!-- dotted / hatched right half of the disc -->
  <g clip-path="url(#disc)">
    <rect x="256" y="96" width="160" height="320" fill="url(#dots)"/>
    <rect x="256" y="96" width="160" height="320" fill="url(#hatch)" opacity="0.55"/>
  </g>

  <!-- stylised M: left stem, valley, right stem -->
  <path d="M 176 306
           L 176 204
           Q 176 191 189 191
           L 199 191
           Q 210 191 217 200
           L 256 246
           L 295 200
           Q 302 191 313 191
           L 323 191
           Q 336 191 336 204
           L 336 306"
        fill="none" stroke="#ED1C24" stroke-width="32"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- striped texture over the right half of the lettering -->
  <path d="M 176 306
           L 176 204
           Q 176 191 189 191
           L 199 191
           Q 210 191 217 200
           L 256 246
           L 295 200
           Q 302 191 313 191
           L 323 191
           Q 336 191 336 204
           L 336 306"
        fill="none" stroke="url(#hatch)" stroke-width="32"
        stroke-linecap="round" stroke-linejoin="round"
        clip-path="url(#disc)" opacity="0.6"/>
</svg>

