name: Bug report
description: Report something that is broken or behaves unexpectedly
title: '[Bug]: '
labels: [bug]
body:
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [GUI, CLI, Both]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `megatemp --version`, or the release tag
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / Ubuntu 24.04 / macOS 15
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or logs
      description: Remove emails, passwords and other credentials before pasting.
      render: shell
