name: Feature request
description: Suggest an improvement or a new capability
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: parity
    attributes:
      label: Relationship to the Python original
      options:
        - label: This already exists in the Python MegaTemp and is missing here
        - label: This is a new idea
